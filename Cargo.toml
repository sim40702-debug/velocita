[workspace]
members = ["motore", "src-tauri"]
resolver = "2"

[profile.release]
opt-level = 3
# "thin": ottimizza tutto il programma insieme come prima, ma usando tutti i
# core del computer. Misurato: l'app va alla stessa velocità (rilevamento
# 11,4 ms a fotogramma, volti 55 ms), il collegamento finale ci mette circa
# un quarto in meno e il programma è 1,9 MB più grande.
# (Per tornare come prima: lto = true)
lto = "thin"
codegen-units = 1
