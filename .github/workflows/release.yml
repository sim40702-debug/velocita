# Crea l'app per Mac (Apple Silicon + Intel) e Windows, con ffmpeg dentro.
# Prima fa girare i test del rilevamento: se uno fallisce, si ferma.
#
# VELOCITÀ: le librerie Rust già compilate (cache) le prepara il workflow
# "Cache" (cache.yml) sul ramo main. Un tag non può salvare una cache che
# serva al tag dopo (su GitHub ogni tag ha la sua), ma può usare quella di main.
# - Se carichi un tag tipo v1.2.3: crea la release su GitHub con gli
#   installer e il file latest.json che serve agli aggiornamenti automatici.
#   Il numero di versione dell'app viene preso dal tag, il testo della
#   release da note-release/<tag>.md (vedi scripts/note_release.mjs).
# - Se premi "Run workflow" nella pagina Actions: crea solo gli installer,
#   li trovi in fondo alla pagina del run (per provare).

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1) prima controlla che il rilevamento del display funzioni ancora
  #    (cargo test -p motore). Se un test fallisce, la release non parte.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Installa Rust
        uses: dtolnay/rust-toolchain@stable

      # usa la cache preparata da cache.yml su main (stesso nome: "test").
      # Salva solo su main: la cache di un tag non la userebbe nessuno.
      - name: Ricorda la compilazione Rust (più veloce le volte dopo)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test del rilevamento
        run: cargo test -p motore

  # 2) poi crea l'app per Mac e Windows
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - sistema: macos-latest
            argomenti: --target universal-apple-darwin
            ffmpeg: universal-apple-darwin
            cartella: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - sistema: windows-latest
            argomenti: ""
            ffmpeg: x86_64-pc-windows-msvc
            cartella: target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.sistema }}

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Installa Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installa Python (serve per scaricare ffmpeg)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.sistema == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # stessa cache preparata da cache.yml su main (un nome per sistema)
      - name: Ricorda la compilazione Rust (più veloce le volte dopo)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: app-${{ matrix.sistema }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Versione dal tag e note della release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSIONE="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(f));c.version='$VERSIONE';fs.writeFileSync(f,JSON.stringify(c,null,2));"
          # la descrizione della release: note-release/<tag>.md (con le immagini),
          # se non c'è l'elenco dei commit (serve la storia completa e i tag)
          # --force serve: il tag scaricato da checkout è diverso da quello su GitHub
          git fetch --force --tags --unshallow origin || git fetch --force --tags origin
          {
            echo "NOTE<<FINE_NOTE"
            node scripts/note_release.mjs "${GITHUB_REF_NAME}"
            echo "FINE_NOTE"
          } >> "$GITHUB_ENV"

      - name: Installa le librerie
        run: npm ci

      - name: Prendi ffmpeg
        run: python scripts/prendi_ffmpeg.py ${{ matrix.ffmpeg }}

      - name: Compila e crea la release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Velocità ${{ github.ref_name }}
          releaseBody: ${{ env.NOTE }}
          releaseDraft: false
          args: ${{ matrix.argomenti }}

      - name: Salva gli installer nella pagina del run (solo prova)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: Velocita-${{ runner.os }}
          path: ${{ matrix.cartella }}
